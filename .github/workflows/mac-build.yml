# Builds the macOS arm64 app and runs the test suites on a real macOS runner.
# A published release also gets the DMG, the zip and latest-mac.yml, after the tests pass. If the
# release did not start this workflow, run it by hand with the tag: gh workflow run mac-build.yml -f tag=v1.5.0
name: macOS build

on:
  push:
    branches: [mac-build]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v1.5.0). Empty builds the branch only.
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Check the release version
        if: env.TAG != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GCC
        run: |
          brew list gcc >/dev/null 2>&1 || brew install gcc
          brew list astyle >/dev/null 2>&1 || brew install astyle

      - name: Install dependencies
        run: |
          npm ci
          npx install-electron --no

      - name: Build DMG and zip
        run: npm run build:mac -- --arm64 --publish never

      - name: Check the app bundle
        run: |
          ls -lh samekodevcpp/*.dmg samekodevcpp/*.zip samekodevcpp/latest-mac.yml
          codesign --verify --deep --strict --verbose=2 "samekodevcpp/mac-arm64/Sameko Dev C++.app"

      - name: Launch the packaged app
        run: |
          "samekodevcpp/mac-arm64/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" --user-data-dir="$RUNNER_TEMP/profile" > launch.log 2>&1 &
          APP_PID=$!
          sleep 20
          kill -0 "$APP_PID"
          kill "$APP_PID"
          grep -E '\[Compiler\] Selected' launch.log

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sameko-dev-cpp-mac-arm64
          path: |
            samekodevcpp/*.dmg
            samekodevcpp/*.zip
            samekodevcpp/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

      - name: Check the app installed from the DMG
        continue-on-error: ${{ env.TAG == '' }}
        timeout-minutes: 10
        shell: bash
        run: |
          DMG=$(ls samekodevcpp/*.dmg)
          MOUNT=$(hdiutil attach -nobrowse "$DMG" | tail -1 | awk -F'\t' '{print $NF}')
          INSTALL="$RUNNER_TEMP/Apps Test"
          mkdir -p "$INSTALL"
          ditto "$MOUNT/Sameko Dev C++.app" "$INSTALL/Sameko Dev C++.app"
          hdiutil detach "$MOUNT"
          xattr -w com.apple.quarantine '0081;00000000;Test;' "$INSTALL/Sameko Dev C++.app"
          xattr -cr "$INSTALL/Sameko Dev C++.app"
          codesign --verify --deep --strict "$INSTALL/Sameko Dev C++.app"
          mkdir -p mac-shots
          # A Homebrew ld.lld must not be picked up: this one fails every link that uses it.
          printf '#!/bin/sh\nexit 1\n' > /opt/homebrew/bin/ld.lld
          chmod +x /opt/homebrew/bin/ld.lld
          node test/mac/packaged.js "$INSTALL/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" mac-shots 2>&1 | tee packaged.log
          STATUS="${PIPESTATUS[0]}"
          rm -f /opt/homebrew/bin/ld.lld
          exit "$STATUS"

      - name: Unit tests
        continue-on-error: ${{ env.TAG == '' }}
        run: node test/run.js unit -v 2>&1 | tee unit.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: GUI tests
        continue-on-error: ${{ env.TAG == '' }}
        timeout-minutes: 15
        run: node test/run.js gui -v 2>&1 | tee gui.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Check a Mac without GCC
        continue-on-error: ${{ env.TAG == '' }}
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gcc-away"
          for f in /opt/homebrew/bin/g++ /opt/homebrew/bin/g++-* /usr/local/bin/g++ /usr/local/bin/g++-*; do
            if [ -e "$f" ] || [ -L "$f" ]; then mv "$f" "$RUNNER_TEMP/gcc-away/"; fi
          done
          # Puts GCC back itself halfway, while the app runs (a `brew install gcc` after launch).
          node test/mac/no-gcc.js "$RUNNER_TEMP/Apps Test/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" "$RUNNER_TEMP/gcc-away" /opt/homebrew/bin 2>&1 | tee no-gcc.log
          STATUS="${PIPESTATUS[0]}"
          mv "$RUNNER_TEMP"/gcc-away/* /opt/homebrew/bin/ 2>/dev/null || true
          exit "$STATUS"

      - name: Check a Homebrew in a custom folder
        continue-on-error: ${{ env.TAG == '' }}
        timeout-minutes: 5
        shell: bash
        run: |
          # Homebrew installed outside /opt/homebrew (issue #58): only the login shell knows where.
          # The default prefix loses brew and GCC; the custom one gets a brew, then GCC halfway.
          BREW="$HOME/custom-brew/bin"; STAGE="$RUNNER_TEMP/gcc-stage"; AWAY="$RUNNER_TEMP/brew-away"
          mkdir -p "$BREW" "$STAGE" "$AWAY" "$RUNNER_TEMP/zdot"
          printf '#!/bin/sh\nexit 0\n' > "$BREW/brew"; chmod +x "$BREW/brew"
          for f in /opt/homebrew/bin/g++ /opt/homebrew/bin/g++-* /opt/homebrew/bin/gcc-* /opt/homebrew/bin/brew; do
            if [ -e "$f" ]; then
              case "$f" in */brew) ;; *) ln -s "$(realpath "$f")" "$STAGE/$(basename "$f")" ;; esac
              mv "$f" "$AWAY/"
            fi
          done
          echo "export PATH=\"$BREW:/usr/bin:/bin:/usr/sbin:/sbin\"" > "$RUNNER_TEMP/zdot/.zprofile"
          env -u HOMEBREW_PREFIX SHELL=/bin/zsh ZDOTDIR="$RUNNER_TEMP/zdot" \
            node test/mac/no-gcc.js "$RUNNER_TEMP/Apps Test/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" "$STAGE" "$BREW" 2>&1 | tee brew-prefix.log
          STATUS="${PIPESTATUS[0]}"
          mv "$AWAY"/* /opt/homebrew/bin/ 2>/dev/null || true
          grep -q "Switched from .* to $BREW/g++-" brew-prefix.log || { echo "the app did not use the GCC in $BREW"; STATUS=1; }
          exit "$STATUS"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-logs
          path: |
            *.log
            mac-shots/*.png
          if-no-files-found: ignore

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" samekodevcpp/*.dmg samekodevcpp/*.zip samekodevcpp/*.blockmap samekodevcpp/latest-mac.yml --clobber
