# Builds the macOS arm64 app and runs the test suites on a real macOS runner.
# A published release also gets the DMG, the zip and latest-mac.yml, after the tests pass.
name: macOS build

on:
  push:
    branches: [mac-build]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the release version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GCC
        run: brew list gcc >/dev/null 2>&1 || brew install gcc

      - name: Install dependencies
        run: |
          npm ci
          npx install-electron --no

      - name: Build DMG and zip
        run: npm run build:mac -- --arm64 --publish never

      - name: Check the app bundle
        run: |
          ls -lh samekodevcpp/*.dmg samekodevcpp/*.zip samekodevcpp/latest-mac.yml
          codesign --verify --deep --strict --verbose=2 "samekodevcpp/mac-arm64/Sameko Dev C++.app"

      - name: Launch the packaged app
        run: |
          "samekodevcpp/mac-arm64/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" --user-data-dir="$RUNNER_TEMP/profile" > launch.log 2>&1 &
          APP_PID=$!
          sleep 20
          kill -0 "$APP_PID"
          kill "$APP_PID"
          grep -E '\[Compiler\] Selected' launch.log

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sameko-dev-cpp-mac-arm64
          path: |
            samekodevcpp/*.dmg
            samekodevcpp/*.zip
            samekodevcpp/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

      - name: Probe watchpoints
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/wp"; cd "$RUNNER_TEMP/wp"
          printf 'int main(){\nvolatile int n=41;\nn=42;\nn=43;\nreturn n==43?0:1;\n}\n' > w.cpp
          GXX=$(ls /opt/homebrew/bin/g++-* | sort -V | tail -1); "$GXX" -g -O0 w.cpp -o w
          cat > "$RUNNER_TEMP/wp-probe.js" <<'EOF'
          const path = require('path');
          const { LldbSession, findLldbDap } = require(path.join(process.env.GITHUB_WORKSPACE, 'app/services/debugger/lldb-session'));
          const dir = process.cwd();
          const s = new LldbSession({ dapPath: findLldbDap(), exePath: path.join(dir, 'w'), cwd: dir });
          const raw = s._onMessage.bind(s);
          s._onMessage = (m) => { if (m.type === 'event' && m.event !== 'output' && m.event !== 'module') console.log('EVENT', JSON.stringify(m.event), JSON.stringify(m.body || {})); raw(m); };
          const original = s.request.bind(s);
          s.request = async (c, a) => { try { const r = await original(c, a); if (/[Dd]ata/.test(c)) console.log('REQ', c, JSON.stringify(a), JSON.stringify(r)); return r; } catch (e) { if (/[Dd]ata/.test(c)) console.log('ERR', c, e.message); throw e; } };
          const next = (t = 10000) => new Promise((ok) => { const done = (v) => { clearTimeout(id); s.off('stopped', a); s.off('programExited', b); ok(v); }; const a = (v) => done({ stopped: v.reason, line: v.frame && v.frame.line, wpt: v.results.wpt, value: v.results.value }); const b = (v) => done({ exited: v.code }); const id = setTimeout(() => done('timeout'), t); s.on('stopped', a); s.on('programExited', b); });
          (async () => {
            await s.start();
            await s.setBreakpoint(path.join(dir, 'w.cpp'), 3);
            let w = next(); await s.run(''); console.log('first', JSON.stringify(await w));
            console.log('watch', JSON.stringify(await s.setWatchpoint('n')));
            w = next(); await s.cont(); console.log('second', JSON.stringify(await w));
            await s.dispose(); process.exit(0);
          })().catch((e) => { console.log('FAILED', e.stack); process.exit(1); });
          EOF
          node "$RUNNER_TEMP/wp-probe.js" 2>&1 | tee "$GITHUB_WORKSPACE/watch-probe.log"

      - name: Unit tests
        continue-on-error: ${{ github.event_name != 'release' }}
        run: node test/run.js unit -v 2>&1 | tee unit.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: GUI tests
        continue-on-error: ${{ github.event_name != 'release' }}
        timeout-minutes: 15
        run: node test/run.js gui -v 2>&1 | tee gui.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-logs
          path: '*.log'
          if-no-files-found: ignore

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" samekodevcpp/*.dmg samekodevcpp/*.zip samekodevcpp/*.blockmap samekodevcpp/latest-mac.yml --clobber
