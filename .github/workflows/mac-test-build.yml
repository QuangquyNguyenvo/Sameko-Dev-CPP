# Builds an unsigned macOS arm64 test DMG and runs the test suites on a real macOS runner.
name: macOS test build

on:
  push:
    branches: [mac-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GCC
        run: brew list gcc >/dev/null 2>&1 || brew install gcc

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run build:mac -- --arm64 --publish never

      - name: Check the app bundle
        run: |
          ls -lh samekodevcpp/*.dmg
          codesign --verify --deep --strict --verbose=2 "samekodevcpp/mac-arm64/Sameko Dev C++.app"

      - name: Launch the packaged app
        run: |
          "samekodevcpp/mac-arm64/Sameko Dev C++.app/Contents/MacOS/Sameko Dev C++" --user-data-dir="$RUNNER_TEMP/profile" > launch.log 2>&1 &
          APP_PID=$!
          sleep 20
          kill -0 "$APP_PID"
          kill "$APP_PID"
          grep -E '\[Compiler\] Selected' launch.log || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: sameko-dev-cpp-mac-arm64
          path: |
            samekodevcpp/*.dmg
            samekodevcpp/*.zip
            samekodevcpp/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

      - name: Probe LLDB with a GCC build
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/lldb"; cd "$RUNNER_TEMP/lldb"
          printf '#include <bits/stdc++.h>\nint main(){std::vector<int> v{1,2,3};int x=41;x++;std::cout<<x+v[1]<<"\\n";}\n' > a.cpp
          GXX=$(ls /opt/homebrew/bin/g++-* | sort -V | tail -1); "$GXX" -g -O0 a.cpp -o a
          ls -la; xcrun -f lldb-dap || true; xcrun -f clangd || true; which lldb
          lldb --batch -o 'b a.cpp:2' -o run -o 'frame variable' -o kill ./a 2>&1 | tee "$GITHUB_WORKSPACE/lldb-probe.log"

      - name: Unit tests
        continue-on-error: true
        run: node test/run.js unit -v 2>&1 | tee unit.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: GUI tests
        continue-on-error: true
        timeout-minutes: 15
        run: node test/run.js gui -v 2>&1 | tee gui.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-logs
          path: '*.log'
          if-no-files-found: ignore
